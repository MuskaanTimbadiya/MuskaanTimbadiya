<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1026" width="1000" height="1026" role="img" aria-labelledby="t d">
<title id="t">Projects</title><desc id="d">Three projects: E-Commerce-E2E-Automation-Framework, DearMe and MindMitra, each with a one-line description and tech tags.</desc>
<style>@font-face{font-family:Sora;font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:Sora;font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format("woff2");}text{font-family:Sora,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f2f4f8}.b{font-weight:800}.s{font-weight:600}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.cb{fill:#247bff}.cr{fill:#ff354f}.cm{fill:#a9b4d0}.cg{fill:url(#rg)}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.dot{animation:pulse 1.6s infinite}@keyframes c0{0%,4%{opacity:0;transform:translateY(24px)}9%,92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}.c0{animation:c0 10s infinite}@keyframes c1{0%,20%{opacity:0;transform:translateY(24px)}25%,92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}.c1{animation:c1 10s infinite}@keyframes c2{0%,36%{opacity:0;transform:translateY(24px)}41%,92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}.c2{animation:c2 10s infinite}</style>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#247bff" fill-opacity=".2"/></pattern>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
<radialGradient id="gbl"><stop offset="0" stop-color="#247bff" stop-opacity=".32"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
<radialGradient id="grd"><stop offset="0" stop-color="#ff354f" stop-opacity=".28"/><stop offset="1" stop-color="#ff354f" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="7"/></filter></defs>
<clipPath id="bgc"><rect width="1000" height="1026" rx="28"/></clipPath>
<g clip-path="url(#bgc)"><rect width="1000" height="1026" fill="#070b16"/>
<ellipse cx="100" cy="51" rx="550" ry="513" fill="url(#gbl)"/>
<ellipse cx="950" cy="1005" rx="550" ry="513" fill="url(#grd)"/>
<rect width="1000" height="1026" fill="url(#dots)"/></g>
<rect x="9" y="9" width="982" height="1008" rx="22" fill="none" stroke="url(#gb)" stroke-width="7" opacity=".5" filter="url(#glow)"/>
<rect x="9" y="9" width="982" height="1008" rx="22" fill="none" stroke="url(#gb)" stroke-width="3"/>
<text x="56" y="96" font-size="46" class="b">PROJECTS</text><circle class="dot" cx="353" cy="80" r="10" fill="#ff354f"/><g class="c0"><rect x="40" y="134" width="920" height="236" rx="24" fill="none" stroke="url(#gb)" stroke-width="6" opacity=".45" filter="url(#glow)"/><rect x="40" y="134" width="920" height="236" rx="24" fill="#0d1530" stroke="url(#gb)" stroke-width="2.5"/><g transform="translate(66 164)"><rect width="60" height="60" rx="16" fill="#121c3e" stroke="#247bff" stroke-opacity=".8" stroke-width="2.5"/><polyline points="16,31 26,41 45,20" fill="none" stroke="#247bff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150" y="194" font-size="30" class="b cb">E-Commerce-E2E-Automation-Framework</text><text x="150" y="228" font-size="28" class="s cm">A production-style automation framework for an</text><text x="150" y="266" font-size="28" class="s cm">e-commerce app.</text><rect x="150" y="296" width="84" height="46" rx="23" fill="#121c3e" stroke="#247bff" stroke-opacity=".7" stroke-width="2"/><text x="192.0" y="327" font-size="26" class="s" text-anchor="middle">E2E</text><rect x="248" y="296" width="200" height="46" rx="23" fill="#121c3e" stroke="#247bff" stroke-opacity=".7" stroke-width="2"/><text x="348.0" y="327" font-size="26" class="s" text-anchor="middle">Automation</text></g><g class="c1"><rect x="40" y="394" width="920" height="294" rx="24" fill="none" stroke="url(#gb)" stroke-width="6" opacity=".45" filter="url(#glow)"/><rect x="40" y="394" width="920" height="294" rx="24" fill="#0d1530" stroke="url(#gb)" stroke-width="2.5"/><g transform="translate(66 424)"><rect width="60" height="60" rx="16" fill="#121c3e" stroke="#ff354f" stroke-opacity=".8" stroke-width="2.5"/><rect x="15" y="11" width="30" height="38" rx="6" fill="none" stroke="#ff354f" stroke-width="4"/><path d="M22 23H38M22 31H38M22 39H31" stroke="#ff354f" stroke-width="4" stroke-linecap="round"/></g><text x="150" y="454" font-size="30" class="b cr">DearMe</text><text x="150" y="488" font-size="28" class="s cm">A full-stack mindfulness journaling app built with</text><text x="150" y="526" font-size="28" class="s cm">React, TypeScript, Express, Firestore and Gemini.</text><rect x="150" y="556" width="115" height="46" rx="23" fill="#121c3e" stroke="#ff354f" stroke-opacity=".7" stroke-width="2"/><text x="207.5" y="587" font-size="26" class="s" text-anchor="middle">React</text><rect x="279" y="556" width="186" height="46" rx="23" fill="#121c3e" stroke="#ff354f" stroke-opacity=".7" stroke-width="2"/><text x="372.0" y="587" font-size="26" class="s" text-anchor="middle">TypeScript</text><rect x="479" y="556" width="143" height="46" rx="23" fill="#121c3e" stroke="#ff354f" stroke-opacity=".7" stroke-width="2"/><text x="550.5" y="587" font-size="26" class="s" text-anchor="middle">Express</text><rect x="636" y="556" width="158" height="46" rx="23" fill="#121c3e" stroke="#ff354f" stroke-opacity=".7" stroke-width="2"/><text x="715.0" y="587" font-size="26" class="s" text-anchor="middle">Firestore</text><rect x="150" y="614" width="135" height="46" rx="23" fill="#121c3e" stroke="#ff354f" stroke-opacity=".7" stroke-width="2"/><text x="217.5" y="645" font-size="26" class="s" text-anchor="middle">Gemini</text></g><g class="c2"><rect x="40" y="712" width="920" height="274" rx="24" fill="none" stroke="url(#gb)" stroke-width="6" opacity=".45" filter="url(#glow)"/><rect x="40" y="712" width="920" height="274" rx="24" fill="#0d1530" stroke="url(#gb)" stroke-width="2.5"/><g transform="translate(66 742)"><rect width="60" height="60" rx="16" fill="#121c3e" stroke="#247bff" stroke-opacity=".8" stroke-width="2.5"/><g stroke="#247bff" stroke-width="4" stroke-linecap="round"><line x1="30" y1="16" x2="16" y2="42"/><line x1="30" y1="16" x2="44" y2="42"/><line x1="16" y1="42" x2="44" y2="42"/></g><g fill="#247bff"><circle cx="30" cy="16" r="7"/><circle cx="16" cy="42" r="7"/><circle cx="44" cy="42" r="7"/></g></g><text x="150" y="772" font-size="30" class="b cb">MindMitra</text><text x="150" y="806" font-size="28" class="s cm">An AI wellness companion for Indian exam aspirants,</text><text x="150" y="844" font-size="28" class="s cm">with multi-agent diagnosis and MCP-backed</text><text x="150" y="882" font-size="28" class="s cm">persistence.</text><rect x="150" y="912" width="199" height="46" rx="23" fill="#121c3e" stroke="#247bff" stroke-opacity=".7" stroke-width="2"/><text x="249.5" y="943" font-size="26" class="s" text-anchor="middle">Multi-agent</text><rect x="363" y="912" width="100" height="46" rx="23" fill="#121c3e" stroke="#247bff" stroke-opacity=".7" stroke-width="2"/><text x="413.0" y="943" font-size="26" class="s" text-anchor="middle">MCP</text><rect x="477" y="912" width="190" height="46" rx="23" fill="#121c3e" stroke="#247bff" stroke-opacity=".7" stroke-width="2"/><text x="572.0" y="943" font-size="26" class="s" text-anchor="middle">AI wellness</text></g>
</svg>
